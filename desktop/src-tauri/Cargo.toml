[package]
name = "kreative-kompanion-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Kreative Kompanion as a desktop app: the web UI in its own window, tray icon, notifications (Apps 1)."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde_json = "1"

[profile.release]
strip = true
lto = true
