[package]
name = "machine-stats"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Linux machine and GPU stats from /proc and sysfs, shared by the Kompanion server and runner."

[dependencies]
serde = { version = "1", features = ["derive"] }
libc = "0.2"

[dev-dependencies]
serde_json = "1"
