# One-file deploy. Copy server/kompanion.example.toml to ./kompanion.toml,
# put API keys in .env, then: docker compose up -d
# The first start prints a setup code in the log: docker compose logs kompanion
services:
  kompanion:
    build: .
    image: kreative-kompanion:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080" # put your HTTPS reverse proxy in front
    extra_hosts:
      - "host.docker.internal:host-gateway" # reach a model server on this PC (e.g. Ollama) on Linux too
    env_file:
      - path: .env # API keys for cloud providers, only if you use them
        required: false
    volumes:
      - ./kompanion.toml:/config/kompanion.toml:ro
      - kompanion-data:/data
      - /etc/os-release:/host/os-release:ro # OS name in the Machines panel
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  kompanion-data:
