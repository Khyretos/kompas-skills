# Tests and builds on soucouyant (the faster PC), not on kireserver.
name: build
on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: soucouyant
    container:
      image: rust:1
    steps:
      - name: Check out (plain git; this image has no Node for actions/checkout)
        run: |
          git init -q . && git -c http.extraHeader="Authorization: token ${{ github.token }}" fetch -q --depth 1 "${{ github.server_url }}/${{ github.repository }}" "${{ github.sha }}" && git checkout -q FETCH_HEAD
      - name: Test the shared stats crate and the server
        run: |
          (cd machine-stats && cargo test)
          (cd server && cargo test --locked)

  web:
    runs-on: soucouyant
    container:
      image: node:22
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Typecheck and build the web app
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run build

  runner:
    runs-on: soucouyant
    container:
      image: rust:1-alpine
    steps:
      - name: Tools
        run: apk add --no-cache git musl-dev
      - name: Check out (plain git; this image has no Node for actions/checkout)
        run: |
          git init -q . && git -c http.extraHeader="Authorization: token ${{ github.token }}" fetch -q --depth 1 "${{ github.server_url }}/${{ github.repository }}" "${{ github.sha }}" && git checkout -q FETCH_HEAD
      - name: Build the static runner binary
        run: |
          cd runner && cargo build --release
          cp target/release/kompanion-runner ../kompanion-runner-x86_64-linux-musl
      - name: Publish the binary as a generic package (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          apk add --no-cache curl >/dev/null
          sha256sum kompanion-runner-x86_64-linux-musl
          for v in "${{ github.sha }}" latest; do
            curl -sf -X DELETE -H "Authorization: token ${{ github.token }}" \
              "${{ github.server_url }}/api/packages/${{ github.repository_owner }}/generic/kompanion-runner/$v" || true
            curl -sf -H "Authorization: token ${{ github.token }}" --upload-file kompanion-runner-x86_64-linux-musl \
              "${{ github.server_url }}/api/packages/${{ github.repository_owner }}/generic/kompanion-runner/$v/kompanion-runner-x86_64-linux-musl"
          done

# The container image is built where it is deployed (kireserver): job containers
# on soucouyant have no Docker daemon, and giving them the host socket would
# hand every job root on soucouyant.
