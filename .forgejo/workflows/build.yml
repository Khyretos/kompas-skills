# Tests and builds on soucouyant (the faster PC), not on kireserver.
name: build
on:
  push:
    branches: [main]
  pull_request:

# soucouyant also runs other repos' CI and ComfyUI (32 GB RAM): cap parallel compiles.
env:
  CARGO_BUILD_JOBS: "6"

jobs:
  server:
    # Same musl image as the Dockerfile, so C dependencies that break on musl fail here
    # (2026-10-04: sqlite-vec built on glibc in CI but not in the deploy).
    runs-on: soucouyant
    container:
      image: rust:1-alpine
    env:
      CFLAGS: "-Du_int8_t=uint8_t -Du_int16_t=uint16_t -Du_int64_t=uint64_t"
    steps:
      - name: Tools
        run: apk add --no-cache git musl-dev
      - name: Check out (plain git; this image has no Node for actions/checkout)
        run: |
          git init -q . && git -c http.extraHeader="Authorization: token ${{ github.token }}" fetch -q --depth 1 "${{ github.server_url }}/${{ github.repository }}" "${{ github.sha }}" && git checkout -q FETCH_HEAD
      - name: Test the shared stats crate and the server
        run: |
          (cd machine-stats && cargo test)
          (cd server && cargo test --locked)

  web:
    runs-on: soucouyant
    container:
      image: node:22
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Typecheck and build the web app
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run build

  web-live:
    # Browser tests in demo mode: every page updates without a reload.
    runs-on: soucouyant
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Playwright tests
        working-directory: web
        run: |
          npm ci
          npx playwright test

  runner:
    runs-on: soucouyant
    container:
      image: rust:1-alpine
    steps:
      - name: Tools
        run: apk add --no-cache git musl-dev
      - name: Check out (plain git; this image has no Node for actions/checkout)
        run: |
          git init -q . && git -c http.extraHeader="Authorization: token ${{ github.token }}" fetch -q --depth 1 "${{ github.server_url }}/${{ github.repository }}" "${{ github.sha }}" && git checkout -q FETCH_HEAD
      - name: Build the static runner binary
        run: |
          cd runner && cargo test && cargo build --release
          cp target/release/kompanion-runner ../kompanion-runner-x86_64-linux-musl
      - name: Show the binary
        # (The job token can't write packages; the binary for PCs is copied by hand.)
        run: ls -l kompanion-runner-x86_64-linux-musl && sha256sum kompanion-runner-x86_64-linux-musl

# The container image is built where it is deployed (kireserver): job containers
# on soucouyant have no Docker daemon, and giving them the host socket would
# hand every job root on soucouyant.
