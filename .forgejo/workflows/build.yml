# Tests and builds on soucouyant (the faster PC), not on kireserver.
name: build
on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: soucouyant
    container:
      image: rust:1
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Test the shared stats crate and the server
        run: |
          (cd machine-stats && cargo test)
          (cd server && cargo test --locked)

  web:
    runs-on: soucouyant
    container:
      image: node:22
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Typecheck and build the web app
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run build

  runner:
    runs-on: soucouyant
    container:
      image: rust:1-alpine
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Build the static runner binary
        run: |
          apk add --no-cache musl-dev
          cd runner && cargo build --release
          cp target/release/kompanion-runner ../kompanion-runner-x86_64-linux-musl
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: kompanion-runner-x86_64-linux-musl
          path: kompanion-runner-x86_64-linux-musl

  image:
    runs-on: soucouyant
    needs: [server, web]
    container:
      image: docker:cli
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Build the container image
        run: docker build -t kreative-kompanion:ci .
