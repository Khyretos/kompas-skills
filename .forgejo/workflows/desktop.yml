# Apps 1: the Kreative Kompanion desktop app (Tauri 2) as an AppImage and a .deb.
# Runs only when desktop/ changes; the files are attached to the run (Artifacts).
name: desktop
on:
  push:
    branches: [main]
    paths: ["desktop/**", ".forgejo/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", ".forgejo/workflows/desktop.yml"]

env:
  CARGO_BUILD_JOBS: "4"   # the kireserver runner is capped at 4 cores

jobs:
  linux:
    runs-on: kireserver
    container:
      image: node:22-bookworm
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Build tools (WebKitGTK, Rust)
        run: |
          apt-get update -qq
          apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file curl >/dev/null
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal -q
      - name: Build the AppImage and the .deb
        working-directory: desktop
        run: |
          . "$HOME/.cargo/env"
          npx --yes @tauri-apps/cli@2 build --ci
          ls -l src-tauri/target/release/bundle/appimage src-tauri/target/release/bundle/deb
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: kreative-kompanion-desktop-linux
          path: |
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
