# Kreative Kompanion server configuration.
## Copy this file to kompanion.toml next to docker-compose.yml and change what you need.
## API keys never go in this file: name an environment variable with `api_key_env`.

# Where to listen. Put a reverse proxy with HTTPS in front for access from outside.
bind = "0.0.0.0:8080"
database = "/data/kompanion.db"
# Name of this server in the Machines panel (its OS comes from /host/os-release if mounted).
# machine_name = "my-server"
web_dir = "/app/web"
# Public origin(s) the web app is served from; state-changing requests from
# other origins are refused.
allowed_origins = ["https://kompanion.example.com"]

# A local model through Ollama (https://ollama.com, MIT). Install it, then run: ollama pull qwen3.5:9b
[[provider]]
id = "ollama"
name = "Ollama on this PC"
kind = "openai-compatible"
base_url = "http://host.docker.internal:11434/v1"
local = true

# More providers (uncomment what you use):
# [[provider]]
# id = "ovms"
# name = "OpenVINO Model Server"
# kind = "openai-compatible"
# base_url = "http://ovms:8000/v3"
# local = true
# api_key_env = "OVMS_API_KEY"
# extra_body = { chat_template_kwargs = { enable_thinking = false } } # Qwen otherwise thinks for thousands of tokens before a short answer.
# [[provider]]
# id = "deepseek"
# name = "DeepSeek"
# kind = "openai-compatible"
# base_url = "https://api.deepseek.com"
# api_key_env = "DEEPSEEK_API_KEY"
# [[provider]]
# id = "anthropic"
# name = "Claude (Anthropic API)"
# kind = "anthropic"
# base_url = "https://api.anthropic.com"
# api_key_env = "ANTHROPIC_API_KEY"

# Starting roles; change them later in the app (Settings > Roles). One local model can fill all three.
[roles]
orchestrator = { provider = "ollama", model = "qwen3.5:9b" }
worker = { provider = "ollama", model = "qwen3.5:9b" }
reviewer = { provider = "ollama", model = "qwen3.5:9b" }

# The asset library's AI (tags, captions, search). Without this section it uses the worker role's model.
# [assets]
# chat_url = "http://ovms:8000/v3"
# model = "Coder"
# embed_url = "http://ovms-cpu:8000/v3"   # /embeddings and /rerank for search by meaning
# embed_model = "Embedder"
# rerank_model = "Reranker"
# audio_model = "Whisper"                 # writes down voice lines in sound files
# api_key_env = "OVMS_API_KEY"

# Voice in the app (push-to-talk and replies read aloud). Off until a URL is set.
# [voice]
# stt_url = "http://ovms:8000/v3"         # speech to text (/audio/transcriptions, e.g. Whisper)
# stt_model = "Whisper"
# tts_url = "http://ovms-cpu:8000/v3"     # text to speech (/audio/speech, e.g. Kokoro)
# tts_model = "Voice"
# api_key_env = "OVMS_API_KEY"

# GPU scheduling (optional): list your GPUs so Kompanion knows what each one holds and has free.
# [[gpu]]
# id = "gpu0"
# machine = "my-server"
# pci = "*"
# vram_gb = 16
# holders = [
#   { name = "qwen3.5:9b", probe = "ollama:http://host.docker.internal:11434", model = "*" },
# ]

# Push to the Android app through UnifiedPush (an ntfy server, FOSS), optional. Phones may only register endpoints on these servers. Empty: push is off; the app can still notify through its own connection.
[push]
servers = []
