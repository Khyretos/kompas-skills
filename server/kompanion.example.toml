# Kreative Kompanion server configuration.
# API keys never go in this file: name an environment variable with `api_key_env`.

# Where to listen. Put a reverse proxy with HTTPS in front for access from outside.
bind = "0.0.0.0:8080"
database = "/data/kompanion.db"
# Name of this server in the Machines panel (its OS comes from /host/os-release if mounted).
# machine_name = "my-server"
web_dir = "/app/web"
# Public origin(s) the web app is served from; state-changing requests from
# other origins are refused.
allowed_origins = ["https://kompanion.example.com"]

[[provider]]
id = "ovms"
name = "OVMS on kireserver"
kind = "openai-compatible"
base_url = "http://ovms:8000/v3"
local = true
api_key_env = "OVMS_API_KEY"
# Qwen otherwise "thinks" for thousands of tokens before a short answer.
extra_body = { chat_template_kwargs = { enable_thinking = false } }

# An Ollama on another PC works too. On kireserver Kompanion uses only OVMS (Kees,
# 2026-10-05: soucouyant is for image and audio generation, not for Kompanion).
[[provider]]
id = "ollama-soucouyant"
name = "Ollama on soucouyant"
kind = "openai-compatible"
base_url = "http://127.0.0.1:11434/v1"
local = true

[[provider]]
id = "deepseek"
name = "DeepSeek"
kind = "openai-compatible"
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"

[[provider]]
id = "anthropic"
name = "Claude (Anthropic API)"
kind = "anthropic"
base_url = "https://api.anthropic.com"
api_key_env = "ANTHROPIC_API_KEY"

# Starting roles; change them later in the app.
[roles]
orchestrator = { provider = "deepseek", model = "deepseek-chat" }
worker = { provider = "ovms", model = "qwen3.5-9b" }
reviewer = { provider = "deepseek", model = "deepseek-chat" }

# M6 GPU ledger (GET /api/gpus). Sizes in MB; the model numbers are estimates until the
# scheduler (M6-02) measures them. A model's peak = weights + KV cache per sequence x sequences.
[[gpu]]
id = "a770"
machine = "kireserver"
pci = "0000:10:00.0"
vram_gb = 16
[[gpu.holder]]
name = "Coder"
probe = "ovms:http://ovms:8000"
weights_mb = 9300
kv_mb_per_seq = 1200
max_seqs = 2
[[gpu.holder]]
name = "Autocomplete"
probe = "ovms:http://ovms:8000"
weights_mb = 2000
[[gpu.holder]]
name = "Whisper"
probe = "ovms:http://ovms:8000"
weights_mb = 1700
[[gpu.holder]]
name = "ComfyUI"
kind = "app"
probe = "comfyui:http://comfyui:8188"
[[gpu.holder]]
name = "HeartMuLa"
kind = "app"
probe = "studio:http://heartmula:8190"
weights_mb = 10000
[[gpu.holder]]
name = "MOSS sound effects"
kind = "app"
probe = "studio:http://moss-sfx:8191"
weights_mb = 11500

# Desktop and Jellyfin: shown, never scheduled.
[[gpu]]
id = "a580"
machine = "kireserver"
pci = "0000:0c:00.0"
vram_gb = 8
schedulable = false

[[gpu]]
id = "rx9070"
machine = "soucouyant"
pci = "*"
vram_gb = 16
[[gpu.holder]]
name = "Ollama"
probe = "ollama:http://192.168.178.80:11434"
model = "*"
[[gpu.holder]]
name = "ComfyUI (soucouyant)"
kind = "app"
probe = "comfyui:http://192.168.178.80:8188"
