[package]
name = "kompanion-server"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Kreative Kompanion server: orchestrator, model routing, history"
publish = false

[dependencies]
anyhow = "1"
argon2 = "0.5"
machine-stats = { path = "../machine-stats" }
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
futures = "0.3"
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls", "timing-resistant-secret-traits"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["fs", "trace", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
flate2 = "1"
tar = "0.4"
regex = "1"
tower = { version = "0.5", features = ["util"] }
sqlite-vec = "0.1.9"
libsqlite3-sys = { version = "0.30", default-features = false }
